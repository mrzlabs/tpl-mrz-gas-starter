name: Deploy Clasp

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'appsscript.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @google/clasp
      - name: Auth clasp
        run: echo "$CLASPRC_JSON" > ~/.clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      - name: Auth project
        run: echo "$CLASP_JSON" > .clasp.json
        env:
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
      - run: clasp push -f